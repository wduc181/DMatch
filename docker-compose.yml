services:

  # ==================== Infrastructure ====================

  postgres:
    image: postgres:16-alpine
    container_name: dmatch-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dmatch-network

  # ==================== 1. Discovery Service ====================

  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: dmatch-discovery
    ports:
      - "8111:8111"
    environment:
      EUREKA_CLIENT_REGISTER-WITH-EUREKA: "false"
      EUREKA_CLIENT_FETCH-REGISTRY: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8111/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dmatch-network

  # ==================== 2. Config Server ====================

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: dmatch-config
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8111/eureka
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dmatch-network

  # ==================== 3. API Gateway ====================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: dmatch-gateway
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8111/eureka
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dmatch-network

  # ==================== 4. User Service ====================

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: dmatch-user
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8111/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - dmatch-network

  # ==================== 5. Auth Service ====================

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: dmatch-auth
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8111/eureka
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - dmatch-network

  # ==================== 6. Company Service ====================

  company-service:
    build:
      context: ./company-service
      dockerfile: Dockerfile
    container_name: dmatch-company
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8111/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/company_service_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dmatch-network

  # ==================== 7. Job Service ====================

  job-service:
    build:
      context: ./job-service
      dockerfile: Dockerfile
    container_name: dmatch-job
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8111/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_service_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dmatch-network

  # ==================== 8. Review Service ====================

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: dmatch-review
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8111/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review_service_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dmatch-network

  # ==================== 9. File Storage Service ====================

  file-storage-service:
    build:
      context: ./file-storage-service
      dockerfile: Dockerfile
    container_name: dmatch-file-storage
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8111/eureka
      JWT_SECRET: ${JWT_SECRET}
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${AWS_SECRET_KEY}
      SPRING_CLOUD_AWS_REGION_STATIC: ${AWS_REGION}
      SPRING_CLOUD_AWS_S3_BUCKET: ${AWS_BUCKET_NAME}
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - dmatch-network

volumes:
  postgres_data:

networks:
  dmatch-network:
    driver: bridge
