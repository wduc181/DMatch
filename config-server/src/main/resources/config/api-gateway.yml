server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      cache:
        ttl: 2s
        capacity: 256
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: false
      routes:
        - id: file-storage-service
          uri: lb://FILE-STORAGE-SERVICE
          predicates:
            - Path=/api/v1/files/**, /internal/files/**
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/v1/reviews/**, /internal/reviews/**
        - id: job-service
          uri: lb://JOB-SERVICE
          predicates:
            - Path=/api/v1/jobs/**, /internal/jobs/**
        - id: company-service
          uri: lb://COMPANY-SERVICE
          predicates:
            - Path=/api/v1/companies/**, /internal/companies/**
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/internal/users/**, /api/v1/users/**, /api/v1/admin/users/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 2
    service-url:
      defaultZone: http://localhost:8111/eureka/
  instance:
    prefer-ip-address: true